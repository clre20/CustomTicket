# ==========================================================
#  CustomTicket (C-Ticket) 設定檔
#  作者: Clre20 | https://github.com/clre20/CustomTicket
#  支援 & 色碼、&#RRGGBB 十六進位色碼與 MiniMessage (<green>文字</green>)
#  新版本新增的設定項目會在啟動 / 重載時自動補齊
# ==========================================================

# 設定檔版本 (請勿修改)
config-version: 1

# 插件訊息開頭的文字
prefix: "&8[&6C-Ticket&8] &r"

# ----------------------------------------------------------
#  更新檢查
# ----------------------------------------------------------
update-checker:
  # 是否在啟動時檢查 GitHub 上的新版本
  enabled: true
  # 有新版本時是否在管理員進入伺服器時提醒
  notify-op: true

# 聊天欄輸入等待時間 (秒)
chat-input-timeout: 60

# ----------------------------------------------------------
#  介面標題
# ----------------------------------------------------------
gui:
  editor-title: "&8門票編輯 - &6%name%"
  commands-title: "&8指令列表 - &6%name%"
  command-action-title: "&8指令 #%index% 操作"
  confirm-title: "&8是否使用門票？"

# ----------------------------------------------------------
#  訊息
# ----------------------------------------------------------
messages:
  no-permission: "&c你沒有權限執行此指令！"
  player-only: "&c此指令只能由玩家執行！"
  unknown-command: "&c未知的子指令，請輸入 &e/%label% help &c查看說明。"
  usage-create: "&c用法: /%label% create <名稱>"
  usage-delete: "&c用法: /%label% del <名稱>"
  usage-give: "&c用法: /%label% give <名稱> [玩家] [數量]"
  usage-edit: "&c用法: /%label% edit <名稱>"
  invalid-name: "&c門票名稱只能包含英文字母、數字、底線與減號！"
  ticket-exists: "&c門票 &e%name% &c已經存在！"
  ticket-not-found: "&c找不到門票 &e%name%&c！"
  player-not-found: "&c找不到玩家 &e%player%&c！"
  invalid-amount: "&c數量必須是 1 ~ 2304 之間的整數！"
  ticket-deleted: "&a已刪除門票 &e%name%&a！"
